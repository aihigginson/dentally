name: App Tests

# Unit tests for the Flask app (Web/app.py) — auth, tenant-scoping, and the
# fail-closed embed-token logic. Pure unit tests; nothing external is called.
on:
  push:
    paths:
      - 'Web/**'
      - '.github/workflows/app-tests.yml'
  pull_request:
    paths:
      - 'Web/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: System deps (unixODBC for pyodbc)
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Web/requirements.txt
          pip install -r Web/requirements-dev.txt

      - name: Run tests
        run: python -m pytest Web/tests -q

name: DW Tests

# Gates (any non-zero exit -> job fails -> deploy blocked):
#   0. Scripts/Check_Process_Dependencies.ps1 -- STATIC: a Gold load that reads another
#      base fact must have an ordering edge (i.e. be GOLD_AGG). No warehouse/secrets.
#   1. Scripts/Run_Tests.ps1          -- DW regression + integrity (SQL via SqlClient)
#   2. Scripts/Check_RLS_Coverage.ps1  -- model-layer RLS leak guard (XMLA via ADOMD)
#   3. Scripts/Check_RLS_Isolation.ps1 -- behavioral RLS isolation (XMLA EffectiveUserName)
# Used as a deploy gate (called by deploy-prod.yml) and for PR-time signal.
# Exits non-zero -> the job fails -> the deploy is blocked.
# NB: the isolation gate needs the SP to remain a workspace ADMIN (EffectiveUserName).
#
# Requires repo secrets:
#   FABRIC_SP_TENANT, FABRIC_SP_CLIENT_ID, FABRIC_SP_CLIENT_SECRET
#
# Notes:
# - windows-latest + shell: powershell (Windows PowerShell 5.1) so the harness'
#   System.Data.SqlClient usage resolves (matches local dev).
# - The harness re-seeds the Test schema each run and captures against the
#   persisted Test.Capture_Baseline. Enforced gates (Run_Tests exits 1 on any):
#   RECONCILE checks (FK NULLs, revenue split, cross-layer counts, sentinel),
#   zero capture errors, AND regression-vs-baseline drift (every metric must
#   match the promoted baseline; 'NEW (no baseline)' stays benign). Baseline
#   re-established 2026-08-02 on the rebuilt deterministic T11 fixture, so
#   regression enforcement is now LIVE (was dormant while T11 was retired).
# - Same-repo PRs only get the secrets; fork PRs will skip auth (by design).

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]

# Serialize all runs: the harness mutates one shared Test schema in the single
# warehouse, so two concurrent runs (e.g. a PR check + the merge's deploy gate)
# would clobber each other. Queue rather than cancel so the deploy gate never
# gets cancelled mid-flight.
concurrency:
  group: dw-tests-shared-warehouse
  cancel-in-progress: false

jobs:
  dw-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Process dependency completeness guard (static; no warehouse)
        shell: powershell
        run: .\Scripts\Check_Process_Dependencies.ps1

      - name: Run DW regression + integrity tests
        shell: powershell
        env:
          FABRIC_SP_TENANT:        ${{ secrets.FABRIC_SP_TENANT }}
          FABRIC_SP_CLIENT_ID:     ${{ secrets.FABRIC_SP_CLIENT_ID }}
          FABRIC_SP_CLIENT_SECRET: ${{ secrets.FABRIC_SP_CLIENT_SECRET }}
        run: .\Scripts\Run_Tests.ps1 -RunTag "ci-${{ github.run_number }}"

      - name: Install ADOMD.NET client (for the RLS coverage check)
        shell: powershell
        run: |
          nuget install Microsoft.AnalysisServices.AdomdClient.retail.amd64 -OutputDirectory "$env:RUNNER_TEMP\adomd" -ExcludeVersion -NonInteractive
          $dll = Get-ChildItem "$env:RUNNER_TEMP\adomd" -Recurse -Filter 'Microsoft.AnalysisServices.AdomdClient.dll' |
                 Where-Object { $_.FullName -match 'net4' } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $dll) {
            $dll = Get-ChildItem "$env:RUNNER_TEMP\adomd" -Recurse -Filter 'Microsoft.AnalysisServices.AdomdClient.dll' | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $dll) { Write-Error 'ADOMD.NET dll not found in NuGet package'; exit 1 }
          "ADOMD_DLL=$dll" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          Write-Host "ADOMD_DLL=$dll"

      - name: RLS coverage check (model-layer leak guard)
        shell: powershell
        env:
          FABRIC_SP_TENANT:        ${{ secrets.FABRIC_SP_TENANT }}
          FABRIC_SP_CLIENT_ID:     ${{ secrets.FABRIC_SP_CLIENT_ID }}
          FABRIC_SP_CLIENT_SECRET: ${{ secrets.FABRIC_SP_CLIENT_SECRET }}
        run: .\Scripts\Check_RLS_Coverage.ps1

      - name: RLS isolation check (behavioral)
        shell: powershell
        env:
          FABRIC_SP_TENANT:        ${{ secrets.FABRIC_SP_TENANT }}
          FABRIC_SP_CLIENT_ID:     ${{ secrets.FABRIC_SP_CLIENT_ID }}
          FABRIC_SP_CLIENT_SECRET: ${{ secrets.FABRIC_SP_CLIENT_SECRET }}
        run: .\Scripts\Check_RLS_Isolation.ps1

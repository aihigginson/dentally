name: Monitor Warehouse Health

# RETIRED as a scheduled job. The health check is now folded into the nightly build itself --
# Orchestrate_Build's final step POSTs /api/monitor/health -- so it runs in-cloud the instant the
# build finishes, with no GitHub cron delay. This workflow is kept ONLY as a manual backstop
# (workflow_dispatch) and is left disabled in Actions; re-enable it if you ever need to poke the
# monitor by hand. Each app scans ITS OWN warehouse; emails are PROD-only.
# Requires: repo secret MONITOR_KEY, matching the MONITOR_KEY env on both Container Apps.

on:
  workflow_dispatch:   # manual only -- the scheduled cron was retired (the nightly build does it now)

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Poke dev + prod health monitor
        env:
          MONITOR_KEY: ${{ secrets.MONITOR_KEY }}
        run: |
          if [ -z "$MONITOR_KEY" ]; then echo "::error::MONITOR_KEY secret not set"; exit 1; fi
          for host in dev.analytically.info app.analytically.info; do
            echo "== $host =="
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST "https://$host/api/monitor/health" \
                     -H "X-Monitor-Key: $MONITOR_KEY" || echo 000)
            cat /tmp/out.json 2>/dev/null; echo
            echo "  http=$code"
            if [ "$code" != "200" ]; then echo "::warning::$host monitor returned $code (health check itself failed)"; fi
          done

name: Deploy Warehouse

# Manifest-driven warehouse deployment via the standard Scripts/Deploy.ps1 runner.
# Triggered by hand (workflow_dispatch) with the manifest filename + target env.
#
# Auth model (DPIA / ACCESS_MODEL.md sec 4):
#   - target=dev  : authenticates with the DEV service principal's client secret
#                   (GitHub secrets FABRIC_SP_*), deploys to the dev warehouse.
#   - target=prod : authenticates with the PROD service principal via GitHub OIDC
#                   federation (NO stored secret) -> acquires a warehouse token ->
#                   Deploy.ps1 uses it (FABRIC_ACCESS_TOKEN). Prod is gated by the
#                   'prod' GitHub Environment (add a required reviewer there if you
#                   want manual approval).

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: 'Manifest filename(s) under Releases/ -- one per line or comma-separated for a batch, deployed in the order given (e.g. V012__remove_free_text.manifest)'
        required: true
      target:
        description: 'Target environment'
        required: true
        type: choice
        options: [dev, prod]
        default: dev
      skip_tests:
        description: 'Skip the TEST regression gate (recommended for schema/data catch-up batches)'
        required: false
        type: boolean
        default: true

permissions:
  id-token: write   # required for OIDC federation (prod)
  contents: read

concurrency:
  group: dw-deploy-shared-warehouse
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: windows-latest
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v5

      # --- PROD only: federated login (no secret) + acquire a warehouse token ---
      - name: Azure login (OIDC)
        if: ${{ inputs.target == 'prod' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.PROD_SP_CLIENT_ID }}
          tenant-id: ${{ vars.FABRIC_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Acquire prod warehouse token
        if: ${{ inputs.target == 'prod' }}
        shell: bash
        run: |
          echo "FABRIC_ACCESS_TOKEN=$(az account get-access-token --resource https://database.windows.net --query accessToken -o tsv)" >> "$GITHUB_ENV"
          echo "FABRIC_SERVER=emeh72n2ntdufpj4q665b2lzx4-eljzajgm5cpe5i64szgon7sej4.datawarehouse.fabric.microsoft.com" >> "$GITHUB_ENV"

      # --- Apply the manifest. Dev uses the SP secret; prod uses FABRIC_ACCESS_TOKEN
      #     set above (Deploy.ps1 prefers the pre-acquired token when present). ---
      - name: Apply release manifest(s)
        shell: powershell
        env:
          FABRIC_SP_TENANT: ${{ secrets.FABRIC_SP_TENANT }}
          FABRIC_SP_CLIENT_ID: ${{ secrets.FABRIC_SP_CLIENT_ID }}
          FABRIC_SP_CLIENT_SECRET: ${{ secrets.FABRIC_SP_CLIENT_SECRET }}
          MANIFESTS: ${{ inputs.manifest }}
          SKIP_TESTS: ${{ inputs.skip_tests }}
        run: |
          $manifests = $env:MANIFESTS -split "[`r`n,]+" | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          $skip = $env:SKIP_TESTS -eq 'true'
          Write-Host "Deploying $($manifests.Count) manifest(s) in order (skip_tests=$skip):"
          $manifests | ForEach-Object { Write-Host "  - $_" }
          foreach ($m in $manifests) {
            Write-Host "`n========== $m =========="
            if ($skip) { .\Scripts\Deploy.ps1 -Manifest "Releases\$m" -SkipTests }
            else       { .\Scripts\Deploy.ps1 -Manifest "Releases\$m" }
          }

  # Regression/reconciliation/RLS gate runs against the DEV test tenant (deterministic
  # T11 baseline), so it only applies to dev deploys. Prod is verified separately.
  verify:
    needs: deploy
    if: ${{ inputs.target == 'dev' }}
    uses: ./.github/workflows/dw-tests.yml
    secrets: inherit

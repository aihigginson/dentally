name: Deploy Site

# Marketing / holding site -> Azure Static Web App (swa-analytically), served on
# the apex analytically.info. Plain static HTML, no build step.
#
#   push to main      -> deploys the live PRODUCTION environment (apex + www)
#   pull_request       -> deploys a throwaway PREVIEW environment, URL posted as a
#                         PR comment; torn down automatically when the PR closes
#   workflow_dispatch -> manual one-off PRODUCTION deploy from any branch

on:
  push:
    branches: [main]
    paths:
      - 'Website/**'
      - '.github/workflows/deploy-site.yml'
  pull_request:
    # Previews are for feature -> dev PRs (where you iterate). The dev -> main
    # publish PR has nothing new to preview and the SWA errors trying to build
    # one ("No matching static site build found"), so restrict to base = dev.
    branches: [dev]
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'Website/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # so the SWA action can post the preview URL as a comment

jobs:
  build_and_deploy:
    # Run for push / manual dispatch, and for PR open/sync/reopen (NOT on close —
    # that's handled by the close_preview job below).
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}   # enables PR preview + comment
          action: upload
          app_location: "Website"
          output_location: ""
          skip_app_build: true

  close_preview:
    # On PR close, tear down the preview environment that was created for it.
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close preview environment
    steps:
      - name: Close Azure Static Web Apps preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close

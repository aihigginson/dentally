name: Deploy Prod

on:
  push:
    branches: [main]
    paths:
      - 'Web/**'
      - '.github/workflows/deploy-prod.yml'
  workflow_dispatch:

jobs:
  # Gate: the DW regression + integrity tests must pass before prod deploys.
  dw-tests:
    uses: ./.github/workflows/dw-tests.yml
    secrets: inherit

  deploy:
    needs: dw-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: analyticallyacr.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./Web
          push: true
          tags: |
            analyticallyacr.azurecr.io/analytically:latest
            analyticallyacr.azurecr.io/analytically:${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Deploy to prod Container App
        run: |
          az containerapp update \
            --name ca-analytically-prod \
            --resource-group rg-analytically \
            --image analyticallyacr.azurecr.io/analytically:${{ github.sha }} \
            --revision-suffix r${{ github.run_number }}

      - name: Smoke test /health
        # Hit the Container App's own default FQDN rather than a custom domain, so
        # this gate is independent of any custom-domain / DNS cutover (the app
        # serves on app.analytically.info; the marketing site owns the apex).
        run: |
          FQDN=$(az containerapp show \
            --name ca-analytically-prod \
            --resource-group rg-analytically \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "probing https://$FQDN/health"
          for i in $(seq 1 6); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://$FQDN/health || true)
            if [ "$code" = "200" ]; then echo "health OK ($code)"; exit 0; fi
            echo "attempt $i: got $code, retrying in 10s"; sleep 10
          done
          echo "::error::/health did not return 200 after retries"; exit 1

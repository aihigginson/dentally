<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analytically — temporarily offline</title>
  <style>
    :root { --navy:#0b2545; --teal:#3aa8a0; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; padding:24px;
      font-family:'Segoe UI', Arial, sans-serif;
      background:linear-gradient(160deg,#0b2545 0%, #12365f 100%);
      color:#eaf1f8; display:flex; align-items:center; justify-content:center;

    .card {
      max-width:560px; width:100%; text-align:center;

    .brand { font-size:26px; font-weight:700; letter-spacing:0.5px; color:#fff; margin-bottom:22px; }
    .brand span { color:var(--teal); }
    h1 { font-size:20px; font-weight:600; margin:0 0 16px; }
    p { font-size:16px; line-height:1.6; color:#c9d6e6; margin:0 0 24px; }
    .phone {
      display:inline-block; font-size:22px; font-weight:700; color:#0b2545; text-decoration:none;
      background:var(--teal); padding:13px 26px; border-radius:10px;
    }
    .phone:hover { filter:brightness(1.08); }
    .foot { margin-top:28px; font-size:13px; color:#8ba3c0; }
  </style>
</head>
<body>
  <div class="card">

</body>
</html>
